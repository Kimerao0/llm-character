name: Release

# Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN anywhere.
#
# One-time setup on npmjs.com: Package settings → Trusted publisher →
# GitHub Actions, repo Kimerao0/llm-character, workflow release.yml.
# Provenance attestations are then generated automatically (no --provenance).
#
# Note the split: pnpm installs, tests and builds, but the publish step itself
# runs through the npm CLI. `pnpm publish` with OIDC is broken on pnpm 11
# (404s — https://github.com/pnpm/pnpm/issues/11513), and npm's own client has
# first-class support, so the last step goes through npm deliberately.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1, newer than the bundled CLI.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish
