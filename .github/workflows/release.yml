name: Release

# Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN.
# One-time setup on npmjs.com: Package settings → Trusted publisher →
# GitHub Actions, repo Kimerao0/llm-character, workflow release.yml.
# Provenance attestations are generated automatically; no --provenance flag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing requires npm >= 11.5.1, newer than the bundled CLI.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish
