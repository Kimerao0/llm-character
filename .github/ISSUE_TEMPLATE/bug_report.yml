name: Bug report
description: Something behaves differently from what the README or the types promise
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest character + config + input that shows it. For parsing bugs, include the raw model reply.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-character version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: node 22 / bun / browser
